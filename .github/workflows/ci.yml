name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          - python: "3.12"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=vtt_clean --cov-fail-under=85

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: vtt-clean process tests/fixtures/clean tests/fixtures/youtube tests/fixtures/quran tests/fixtures/edge -o /tmp/out --format all
      - run: test -s /tmp/out/stats.json
      - run: test -s /tmp/out/unknown-events.tsv
