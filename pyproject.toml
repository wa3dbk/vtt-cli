[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vtt-clean"
version = "0.1.0"
description = "VTT cleaning and text extraction CLI for ASR corpora"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "waadbk"}]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "regex>=2024.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
vtt-clean = "vtt_clean.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vtt_clean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["vtt_clean"]
